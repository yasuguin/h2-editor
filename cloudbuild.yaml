# @format

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --source
      - .
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "3000"

      # --- リソース設定 ---
      - --memory
      - 2Gi
      - --cpu
      - "1"

      # リクエストタイムアウト
      - --timeout
      - "3600" # 秒

      # 最大同時実行数
      - --concurrency
      - "80"

      # 最大インスタンス数
      - --max-instances
      - "10"

      # --- 環境変数設定 ---
      - --set-env-vars
      - >-
        NODE_ENV=production,
        GOOGLE_CLOUD_PROJECT_ID=$PROJECT_ID,
        GOOGLE_CLOUD_LOCATION=$_REGION,
        PUBSUB_TOPIC_NAME=import_access_log

      # --- ビルド時環境変数設定 (一部のランタイムで利用) ---
      - --set-build-env-vars
      - GOOGLE_NODE_RUN_SCRIPTS=build

# --- ビルドオプション ---
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: "100"
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"

substitutions:
  _SERVICE_NAME: h2-editor
  _REGION: asia-northeast1
